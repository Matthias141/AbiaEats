name: Security & Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  security-scans:
    name: Security Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: "p/typescript,p/nextjs,p/secrets,p/owasp-top-ten"
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: OWASP ZAP baseline scan (PR only)
        if: github.event_name == 'pull_request'
        uses: zaproxy/action-baseline@v0.10.0
        # IMPORTANT: do not continue on error so failures are visible
        with:
          target: 'https://abia-eats-staging.vercel.app'
          # consider customizing rules and thresholds here

  build-and-lint:
    name: Build, lint, and typecheck
    runs-on: ubuntu-latest
    needs: security-scans
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit (fail on critical)
        run: |
          npm audit --json > audit.json || true
          cat audit.json
          # exit non-zero if any critical advisories found
          node -e "
            const data = require('./audit.json');
            const crit = (data && data.metadata && data.metadata.vulnerabilities && data.metadata.vulnerabilities.critical) || 0;
            if (crit > 0) { console.error('Critical vulnerabilities found'); process.exit(1); }
          "

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Build
        env:
          # Use repository secrets only; DO NOT provide fallback secret values here
          # NOTE: NEXT_PUBLIC_* variables are client-exposed; ensure these are safe to expose
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_APP_NAME: 'AbiaEats'
          NEXT_PUBLIC_OPAY_ACCOUNT_NAME: 'AbiaEats'
          NEXT_PUBLIC_OPAY_ACCOUNT_NUMBER: ${{ secrets.NEXT_PUBLIC_OPAY_ACCOUNT_NUMBER }}
        run: npm run build
